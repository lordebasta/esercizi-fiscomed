services:
  db-dev:
    image: postgres:14.5
    restart: always
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
    ports:
      - 5432:5432

  db-test:
    image: postgres:14.5
    restart: always
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
    ports:
      - 5433:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
